server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Compression Gzip ───────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ─── Headers de sécurité (niveau server, hérités par tous les locations) ─
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://schema.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';" always;

    # ─── Health check endpoint (pour Docker HEALTHCHECK) ────────────
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ─── Application SPA ────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Cache agressif pour les assets hashés par Vite ─────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, no-transform" always;
        # Réinjecter les headers de sécurité (obligatoire car add_header
        # dans un location remplace ceux du bloc server)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://schema.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';" always;
    }

    # ─── Fichiers statiques racine (favicon, manifest, robots.txt) ──
    location ~* ^/(favicon\.ico|manifest\.json|robots\.txt|sitemap\.xml|logo.*\.png)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform" always;
        access_log off;
    }

    # ─── Désactiver l'accès aux fichiers cachés ─────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
