name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Node.js
        uses: actions/setup-node@39225d34a242f78575847769d67fc1a6c41f28b4 # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Code Quality (Lint)
        run: npm run lint
        
      - name: Type Checking (TypeScript)
        run: npx tsc --noEmit
        
      - name: Build Application
        run: npm run build
