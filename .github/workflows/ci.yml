name: CI/CD — Ekose RX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Validation (lint + typecheck + build) ────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality (Lint)
        run: npm run lint

      - name: Type Checking (TypeScript)
        run: npx tsc --noEmit

      - name: Build Application
        run: npm run build

  # ─── Déploiement sur VPS (uniquement sur push vers main) ─────────
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /var/www/ekose-rx-vitrine/site
            echo "📥 Pulling latest code..."
            git pull origin main
            echo "🐳 Rebuilding container..."
            docker compose up --build -d
            echo "⏳ Waiting for healthcheck..."
            sleep 10
            if curl -sf http://127.0.0.1:8081/health > /dev/null; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Health check failed"
              docker logs ekose-showcase-web --tail 20
              exit 1
            fi
