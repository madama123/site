services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ekose-showcase-web
    ports:
      - "8081:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "ekose-web"
    networks:
      - ekose-rx_ekose-net

networks:
  ekose-rx_ekose-net:
    external: true
